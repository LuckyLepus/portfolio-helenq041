<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Helen.Q — Private Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f5f7f6;
      background: #060908;
      --accent: #00ef8b;
      --accent-dark: #002d1d;
      --pointer-x: 0;
      --pointer-y: 0;
      --focus: 0;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #060908;
    }

    button, input { font: inherit; }

    .stage {
      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 26% 16%, rgb(52 59 213 / .38), transparent 38%),
        radial-gradient(ellipse at 83% 82%, rgb(0 163 94 / .28), transparent 34%),
        linear-gradient(135deg, #0b0c18 0%, #060908 56%, #06130d 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgb(4 6 8 / .12), transparent 34%, rgb(4 6 8 / .18)),
        radial-gradient(circle at 50% 45%, transparent 0 26%, rgb(1 4 3 / .22) 74%);
      backdrop-filter: blur(calc(14px - var(--focus) * 4px)) saturate(116%);
      -webkit-backdrop-filter: blur(calc(14px - var(--focus) * 4px)) saturate(116%);
      transition: backdrop-filter .4s ease, opacity .65s ease;
    }

    .preview {
      position: absolute;
      inset: -5%;
      z-index: 1;
      overflow: hidden;
      opacity: .8;
      transform: translate3d(calc(var(--pointer-x) * -9px), calc(var(--pointer-y) * -7px), 0) scale(1.05);
      transition: filter .5s ease, opacity .5s ease;
      will-change: transform;
    }

    .preview-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px);
      background-size: 7.5vw 7.5vw;
      mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 76%, transparent);
    }

    .preview-brand {
      position: absolute;
      top: 6.5%;
      left: 5.5%;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      letter-spacing: -.02em;
      color: rgb(255 255 255 / .82);
    }

    .preview-brand::after {
      content: "";
      width: 112px;
      height: 7px;
      border-radius: 999px;
      background: rgb(255 255 255 / .26);
      box-shadow: 0 14px 0 rgb(255 255 255 / .14);
      filter: blur(2px);
    }

    .preview-title {
      position: absolute;
      left: 4.8%;
      top: 51%;
      font-size: clamp(72px, 10vw, 174px);
      font-weight: 400;
      line-height: .78;
      letter-spacing: -.09em;
      writing-mode: vertical-rl;
      transform: translateY(-50%) rotate(180deg);
      color: rgb(255 255 255 / .72);
      text-shadow: 0 20px 80px rgb(0 0 0 / .45);
    }

    .preview-nav {
      position: absolute;
      top: 7%;
      right: 6%;
      display: flex;
      gap: 36px;
    }

    .preview-nav span,
    .preview-index i {
      display: block;
      border-radius: 999px;
      background: rgb(255 255 255 / .24);
      filter: blur(2.5px);
    }

    .preview-nav span { width: 70px; height: 8px; }

    .preview-index {
      position: absolute;
      right: 6%;
      top: 24%;
      width: min(260px, 22vw);
      display: grid;
      gap: 25px;
      padding-top: 26px;
      border-top: 1px solid rgb(255 255 255 / .2);
    }

    .preview-index i { height: 10px; opacity: .58; }
    .preview-index i:nth-child(2) { width: 72%; }
    .preview-index i:nth-child(3) { width: 88%; }
    .preview-index i:nth-child(4) { width: 64%; }
    .preview-index i:nth-child(5) { width: 78%; }

    .artifact {
      position: absolute;
      border: 1px solid rgb(255 255 255 / .13);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 40px 100px rgb(0 0 0 / .32);
      will-change: transform;
    }

    .artifact-a {
      left: 31%;
      top: 13%;
      width: clamp(180px, 24vw, 420px);
      aspect-ratio: 1.5;
      border-radius: 45% 55% 58% 42% / 36% 40% 60% 64%;
      background:
        radial-gradient(circle at 36% 35%, rgb(255 255 255 / .28), transparent 16%),
        radial-gradient(circle at 62% 62%, rgb(0 239 139 / .62), transparent 31%),
        linear-gradient(145deg, rgb(42 31 166 / .8), rgb(6 9 8 / .22));
      transform: translate3d(calc(var(--pointer-x) * 25px), calc(var(--pointer-y) * 19px), 0) rotate(-7deg);
      animation: breathe-a 9s ease-in-out infinite alternate;
    }

    .artifact-b {
      left: 45%;
      bottom: 5%;
      width: clamp(210px, 31vw, 520px);
      aspect-ratio: 2 / 1;
      border-radius: 58% 42% 35% 65% / 52% 55% 45% 48%;
      background:
        radial-gradient(circle at 68% 38%, rgb(36 52 220 / .86), transparent 27%),
        linear-gradient(115deg, rgb(0 239 139 / .32), rgb(5 15 10 / .28) 58%);
      transform: translate3d(calc(var(--pointer-x) * -34px), calc(var(--pointer-y) * -25px), 0) rotate(9deg);
      animation: breathe-b 11s ease-in-out infinite alternate;
    }

    .artifact-c {
      right: 20%;
      top: 31%;
      width: clamp(96px, 13vw, 220px);
      aspect-ratio: 1;
      border-radius: 48% 52% 64% 36% / 64% 43% 57% 36%;
      background:
        radial-gradient(circle at 38% 36%, rgb(255 255 255 / .36), transparent 12%),
        conic-gradient(from 40deg, rgb(0 239 139 / .58), rgb(42 31 166 / .74), rgb(0 239 139 / .28));
      transform: translate3d(calc(var(--pointer-x) * 46px), calc(var(--pointer-y) * -31px), 0) rotate(18deg);
      animation: breathe-c 8s ease-in-out infinite alternate;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .frame-label {
      position: absolute;
      z-index: 10;
      top: max(24px, env(safe-area-inset-top));
      left: clamp(22px, 3vw, 52px);
      display: flex;
      align-items: center;
      gap: 11px;
      font: 600 10px/1 Arial, sans-serif;
      letter-spacing: .18em;
      color: rgb(255 255 255 / .54);
    }

    .frame-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgb(0 239 139 / .9);
    }

    .frame-meta {
      position: absolute;
      z-index: 10;
      top: max(23px, env(safe-area-inset-top));
      right: clamp(22px, 3vw, 52px);
      font: 600 10px/1 Arial, sans-serif;
      letter-spacing: .16em;
      color: rgb(255 255 255 / .46);
    }

    .access-panel {
      position: absolute;
      z-index: 20;
      left: clamp(22px, 5vw, 84px);
      bottom: clamp(22px, 7vh, 84px);
      width: min(690px, calc(100vw - 44px));
      border: 1px solid rgb(255 255 255 / .22);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgb(255 255 255 / .13), rgb(255 255 255 / .045) 48%, rgb(0 239 139 / .045)),
        rgb(7 11 10 / .48);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / .22),
        inset 0 -1px 0 rgb(255 255 255 / .06),
        0 34px 100px rgb(0 0 0 / .48);
      backdrop-filter: blur(30px) saturate(145%);
      -webkit-backdrop-filter: blur(30px) saturate(145%);
      overflow: hidden;
      transition: transform .42s cubic-bezier(.22,1,.36,1), border-color .3s ease, opacity .5s ease;
    }

    .access-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 0 0, rgb(255 255 255 / .18), transparent 38%);
    }

    .panel-copy {
      position: relative;
      padding: 28px 30px 24px;
      display: grid;
      grid-template-columns: minmax(170px, .85fr) minmax(260px, 1.45fr);
      gap: 34px;
      align-items: end;
    }

    .identity { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; }

    .brand {
      margin: 0;
      font-size: clamp(31px, 4vw, 48px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: -.055em;
    }

    .session-note {
      margin: 24px 0 0;
      max-width: 24ch;
      font-size: 11px;
      line-height: 1.65;
      color: rgb(255 255 255 / .48);
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 10px;
      font-size: 11px;
      line-height: 1;
      color: rgb(255 255 255 / .62);
    }

    .field-label span:last-child {
      font-size: 9px;
      letter-spacing: .12em;
      color: var(--accent);
    }

    .field-shell {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgb(255 255 255 / .22);
      border-radius: 13px;
      background: rgb(255 255 255 / .06);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / .06);
      transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
    }

    .field-shell:focus-within {
      border-color: rgb(0 239 139 / .72);
      background: rgb(255 255 255 / .085);
      box-shadow: 0 0 0 3px rgb(0 239 139 / .1), inset 0 1px 0 rgb(255 255 255 / .1);
    }

    input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    input::placeholder {
      color: rgb(255 255 255 / .24);
      letter-spacing: .06em;
      text-transform: none;
    }

    button {
      min-width: 126px;
      height: 48px;
      padding: 0 19px;
      border: 0;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, opacity .2s ease;
    }

    button:hover { background: #35f5a4; }
    button:active { transform: translateY(1px) scale(.985); }
    button:disabled { opacity: .62; cursor: wait; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    #message {
      min-height: 18px;
      margin: 9px 3px 0;
      font-size: 11px;
      line-height: 1.5;
      color: #ff9eaa;
    }

    .access-panel.is-error {
      border-color: rgb(255 111 128 / .62);
      animation: panel-error .42s cubic-bezier(.36,.07,.19,.97);
    }

    .access-panel.is-error .field-shell {
      border-color: rgb(255 111 128 / .72);
      box-shadow: 0 0 0 3px rgb(255 111 128 / .08);
    }

    .stage.is-verifying .artifact { filter: brightness(1.12) saturate(1.08); }

    .stage.is-success { --focus: 1; }
    .stage.is-success::before { opacity: 0; }
    .stage.is-success .preview { opacity: 1; filter: saturate(1.18); }
    .stage.is-success .access-panel { transform: translateY(22px) scale(.975); opacity: 0; }

    @keyframes breathe-a {
      to { margin-top: 18px; border-radius: 55% 45% 43% 57% / 46% 52% 48% 54%; }
    }

    @keyframes breathe-b {
      to { margin-left: -13px; margin-bottom: 18px; border-radius: 44% 56% 55% 45% / 38% 48% 52% 62%; }
    }

    @keyframes breathe-c {
      to { margin-top: -20px; border-radius: 60% 40% 46% 54% / 42% 58% 42% 58%; }
    }

    @keyframes panel-error {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @media (max-width: 720px) {
      .preview { inset: -8%; opacity: .68; }
      .preview-grid { background-size: 18vw 18vw; }
      .preview-title { left: 2%; top: 43%; font-size: 24vw; }
      .preview-brand { left: 8%; top: 10%; }
      .preview-nav { right: 9%; top: 10%; gap: 16px; }
      .preview-nav span { width: 42px; }
      .preview-index { right: 9%; top: 24%; width: 34vw; gap: 18px; }
      .artifact-a { left: 32%; top: 20%; width: 53vw; }
      .artifact-b { left: 24%; bottom: 20%; width: 72vw; }
      .artifact-c { right: 8%; top: 48%; width: 30vw; }

      .access-panel {
        left: 14px;
        right: 14px;
        bottom: max(14px, env(safe-area-inset-bottom));
        width: auto;
        border-radius: 16px;
      }

      .panel-copy {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 24px 20px 20px;
      }

      .identity { display: block; }
      .session-note { margin-top: 12px; max-width: 34ch; }
      .field-shell { grid-template-columns: 1fr; gap: 7px; }
      button { width: 100%; }
      .frame-meta { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .preview, .artifact { transform: none !important; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .stage::before { backdrop-filter: none; -webkit-backdrop-filter: none; background: rgb(5 8 7 / .82); }
      .access-panel { backdrop-filter: none; -webkit-backdrop-filter: none; background: #101714; }
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .stage::before { background: rgb(5 8 7 / .78); }
      .access-panel { background: rgb(13 20 17 / .96); }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="preview" aria-hidden="true">
      <div class="preview-grid"></div>
      <div class="preview-brand">Helen.Q</div>
      <div class="preview-title">HELEN.Q</div>
      <div class="preview-nav"><span></span><span></span></div>
      <div class="preview-index"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="artifact artifact-a"></div>
      <div class="artifact artifact-b"></div>
      <div class="artifact artifact-c"></div>
    </div>

    <div class="grain" aria-hidden="true"></div>
      <div class="frame-label">ACCESS LAYER</div>
    <div class="frame-meta">PRIVATE VIEW · 4H</div>

    <main class="access-panel" id="access-panel">
      <div class="panel-copy">
        <div class="identity">
          <h1 class="brand">Helen.Q</h1>
          <p class="session-note">输入当天暗号，解锁这次作品浏览。验证仅在服务端完成。</p>
        </div>

        <form id="unlock-form" novalidate>
          <label class="field-label" for="code">
            <span>Daily access code / 当天暗号</span>
            <span id="field-state" aria-hidden="true">READY</span>
          </label>
          <div class="field-shell">
            <input id="code" name="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="64" placeholder="Enter code" required>
            <button id="submit" type="submit">进入作品集</button>
          </div>
          <div id="message" role="status" aria-live="polite"></div>
        </form>
      </div>
    </main>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const panel = document.getElementById('access-panel');
    const form = document.getElementById('unlock-form');
    const input = document.getElementById('code');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    const fieldState = document.getElementById('field-state');
    const params = new URLSearchParams(location.search);
    const candidate = params.get('next') || '/';
    const nextPath = candidate.startsWith('/') && !candidate.startsWith('//') ? candidate : '/';
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let pointerFrame = 0;
    let pointerX = 0;
    let pointerY = 0;

    const renderPointer = () => {
      stage.style.setProperty('--pointer-x', pointerX.toFixed(3));
      stage.style.setProperty('--pointer-y', pointerY.toFixed(3));
      pointerFrame = 0;
    };

    if (!reducedMotion) {
      window.addEventListener('pointermove', (event) => {
        pointerX = (event.clientX / innerWidth - .5) * 2;
        pointerY = (event.clientY / innerHeight - .5) * 2;
        if (!pointerFrame) pointerFrame = requestAnimationFrame(renderPointer);
      }, { passive: true });
    }

    input.addEventListener('input', () => {
      const progress = Math.min(input.value.trim().length / 9, 1);
      stage.style.setProperty('--focus', progress.toFixed(2));
      panel.classList.remove('is-error');
      message.textContent = '';
      fieldState.textContent = progress ? 'INPUT' : 'READY';
    });

    if (matchMedia('(min-width: 721px) and (pointer: fine)').matches) input.focus();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!input.value.trim()) {
        message.textContent = '请输入当天暗号。';
        panel.classList.add('is-error');
        input.focus();
        return;
      }

      button.disabled = true;
      input.disabled = true;
      panel.classList.remove('is-error');
      stage.classList.add('is-verifying');
      fieldState.textContent = 'VERIFYING';
      button.textContent = '正在验证';
      message.textContent = '';

      try {
        const response = await fetch('/api/unlock', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code: input.value})
        });
        const result = await response.json().catch(() => null);
        if (!result) throw new Error('验证服务暂时不可用，请稍后重试。');
        if (!response.ok || !result.valid) throw new Error(result.message || '暗号验证失败。');

        fieldState.textContent = 'ACCESS GRANTED';
        button.textContent = '验证成功';
        stage.classList.remove('is-verifying');
        stage.classList.add('is-success');
        setTimeout(() => location.replace(nextPath), reducedMotion ? 80 : 620);
      } catch (error) {
        stage.classList.remove('is-verifying');
        panel.classList.add('is-error');
        fieldState.textContent = 'TRY AGAIN';
        message.textContent = error.message || '暂时无法验证，请稍后重试。';
        input.disabled = false;
        button.disabled = false;
        button.textContent = '重新验证';
        input.select();
      }
    });
  </script>
</body>
</html>
