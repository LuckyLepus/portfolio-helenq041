<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Helen.Q — Private Portfolio</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#090718;color:#fff}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 20%,#4432d9 0,transparent 35%),radial-gradient(circle at 85% 75%,#08643b 0,transparent 30%),#090718}
    main{width:min(520px,100%);padding:40px;border:1px solid #ffffff24;border-radius:28px;background:#100d26dd;box-shadow:0 30px 90px #0008;backdrop-filter:blur(20px)}
    .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#00ff85}
    h1{font-size:clamp(32px,8vw,54px);font-weight:500;line-height:1;margin:14px 0 20px}
    p{line-height:1.7;color:#c7c4d5}
    label{display:block;margin:28px 0 9px;font-size:13px;color:#dedbea}
    input,button{width:100%;min-height:52px;border-radius:14px;font:inherit}
    input{border:1px solid #ffffff2e;background:#ffffff0d;color:#fff;padding:0 16px;letter-spacing:.1em;text-transform:uppercase}
    input:focus{outline:2px solid #00ff85;outline-offset:2px}
    button{margin-top:12px;border:0;background:#00ff85;color:#07160e;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #message{min-height:24px;margin-top:14px;font-size:13px;color:#ff91aa}
    .contact{margin-top:30px;padding-top:22px;border-top:1px solid #ffffff1f;font-size:13px}
    a{color:#fff}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Private portfolio · 4-hour session</div>
    <h1>Helen.Q</h1>
    <p>请输入当天访问暗号。暗号只在服务端验证，成功后浏览器会收到一枚短期、HttpOnly 的访问凭证。</p>
    <form id="unlock-form">
      <label for="code">Daily access code / 当天暗号</label>
      <input id="code" name="code" autocomplete="one-time-code" maxlength="64" required autofocus>
      <button id="submit" type="submit">进入作品集</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
    <p class="contact">
      境外：<a href="mailto:flowernursery@gmail.com">flowernursery@gmail.com</a><br>
      境内：<a href="mailto:lucky_rabbit@foxmail.com">lucky_rabbit@foxmail.com</a>
    </p>
  </main>
  <script>
    const form = document.getElementById('unlock-form');
    const input = document.getElementById('code');
    const button = document.getElementById('submit');
    const message = document.getElementById('message');
    const params = new URLSearchParams(location.search);
    const candidate = params.get('next') || '/';
    const nextPath = candidate.startsWith('/') && !candidate.startsWith('//') ? candidate : '/';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/unlock', {
          method: 'POST',
          credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({code: input.value})
        });
        const result = await response.json();
        if (!response.ok || !result.valid) throw new Error(result.message || '暗号验证失败。');
        location.replace(nextPath);
      } catch (error) {
        message.textContent = error.message || '暂时无法验证，请稍后重试。';
        input.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
